    <!-- THREE.JS LOGIC -->
    <script>
        /*[CFG]*/
const LATIDO = {
  msg: "Te Amo",
  sub: "Universo en constante latido"
};
const MUSIC = {"src":"","title":""};
/*[/CFG]*/

        // Textos desde la configuración
        const messageDisplay0 = document.getElementById('messageDisplay');
        const subMessageDisplay0 = document.getElementById('subMessageDisplay');
        messageDisplay0.textContent = LATIDO.msg;
        subMessageDisplay0.textContent = LATIDO.sub;

        // El panel de controles es del creador: oculto para el regalo
        const controlsPanel0 = document.getElementById('controlsPanel');
        const toggleUI0 = document.getElementById('toggleUI');
        controlsPanel0.style.display = 'none';
        toggleUI0.style.display = 'none';

        // --- 1. CONFIGURACIÓN Y ESCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030008, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.minDistance = 20;
        controls.maxDistance = 80;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;

        // Color Themes Definition
        const COLOR_THEMES = {
            pink: {
                primary: new THREE.Color(0xff2a7a),
                secondary: new THREE.Color(0xff73b3),
                glow: '#ff2a7a'
            },
            purple: {
                primary: new THREE.Color(0xa855f7),
                secondary: new THREE.Color(0xc084fc),
                glow: '#a855f7'
            },
            turquoise: {
                primary: new THREE.Color(0x00f2fe),
                secondary: new THREE.Color(0x4facfe),
                glow: '#00f2fe'
            },
            gold: {
                primary: new THREE.Color(0xfbbf24),
                secondary: new THREE.Color(0xf59e0b),
                glow: '#fbbf24'
            }
        };

        let currentTheme = COLOR_THEMES.pink;

        // --- 2. GENERACIÓN DE PUNTOS PARAMÉTRICOS DEL CORAZÓN 3D ---
        let particleCount = 12000;
        let heartGeometry, heartMaterial, heartParticles;
        let targetPositions = [];
        let sourcePositions = [];
        let animationProgress = 0;

        // Ecuación Paramétrica 3D del Corazón
        function getHeartPoint(t, u) {
            // t de -PI a PI, u de -PI/2 a PI/2
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = u * 6 * Math.sin(t); // Profundidad suave en 3D
            return new THREE.Vector3(x * 0.9, y * 0.9, z);
        }

        function createHeartParticleSystem(count) {
            if (heartParticles) scene.remove(heartParticles);

            particleCount = count;
            heartGeometry = new THREE.BufferGeometry();

            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            
            targetPositions = [];
            sourcePositions = [];

            for (let i = 0; i < particleCount; i++) {
                // Generar punto en la superficie y volumen del corazón
                const t = (Math.random() - 0.5) * Math.PI * 2;
                const u = (Math.random() - 0.5) * Math.PI;
                const volumeFactor = 0.7 + Math.random() * 0.3; // Relleno interior suave

                const pt = getHeartPoint(t, u);
                pt.multiplyScalar(volumeFactor);

                // Posición objetivo (Corazón)
                targetPositions.push(pt.x, pt.y, pt.z);

                // Posición origen dispersa (Efecto Ensamblaje)
                const rx = (Math.random() - 0.5) * 120;
                const ry = (Math.random() - 0.5) * 120;
                const rz = (Math.random() - 0.5) * 120;
                sourcePositions.push(rx, ry, rz);

                // Iniciar en posición dispersa
                positions[i * 3] = rx;
                positions[i * 3 + 1] = ry;
                positions[i * 3 + 2] = rz;

                // Color Gradiente
                const mixFactor = Math.random();
                const pColor = currentTheme.primary.clone().lerp(currentTheme.secondary, mixFactor);
                colors[i * 3] = pColor.r;
                colors[i * 3 + 1] = pColor.g;
                colors[i * 3 + 2] = pColor.b;

                // Tamaño variado
                sizes[i] = Math.random() * 0.8 + 0.4;
            }

            heartGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            heartGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Textura circular de punto luminoso
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.8, 'rgba(255, 255, 255, 0.2)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);

            const pTexture = new THREE.CanvasTexture(canvas);

            heartMaterial = new THREE.PointsMaterial({
                size: 1.2,
                map: pTexture,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            heartParticles = new THREE.Points(heartGeometry, heartMaterial);
            scene.add(heartParticles);

            // Animar ensamblaje inicial con GSAP
            triggerAssemblyAnimation();
        }

        // --- 3. ANIMACIÓN DE ENSAMBLAJE Y PULSACIÓN ---
        let assemblyProgress = { value: 0 };

        function triggerAssemblyAnimation() {
            assemblyProgress.value = 0;
            gsap.to(assemblyProgress, {
                value: 1,
                duration: 2.8,
                ease: "power3.inOut"
            });
        }

        // Fondo de Polvo Estelar
        const bgParticleCount = 800;
        const bgGeometry = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(bgParticleCount * 3);

        for (let i = 0; i < bgParticleCount * 3; i += 3) {
            bgPositions[i] = (Math.random() - 0.5) * 160;
            bgPositions[i + 1] = (Math.random() - 0.5) * 160;
            bgPositions[i + 2] = (Math.random() - 0.5) * 160;
        }

        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        const bgMaterial = new THREE.PointsMaterial({
            size: 0.8,
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const bgParticles = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(bgParticles);

        // --- 4. INTERACCIÓN DE HOVER / RIPPLE CON RAYCASTER ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-100, -100);

        window.addEventListener('pointermove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // --- 5. BUCLE DE ANIMACIÓN PRINCIPAL ---
        let isPlaying = true;
        let pulseSpeed = 1.0;
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (isPlaying && heartParticles) {
                const positions = heartGeometry.attributes.position.array;

                // Ritmo de latido de corazón (Doble pulso: lub-dub)
                const beatTime = (elapsedTime * pulseSpeed * 2.2) % (Math.PI * 2);
                let pulseScale = 1.0;
                
                // Expresión matemática para doble latido fluido
                if (beatTime < Math.PI * 0.4) {
                    pulseScale = 1 + Math.sin(beatTime * 5) * 0.12;
                } else if (beatTime < Math.PI * 0.8) {
                    pulseScale = 1 + Math.sin((beatTime - Math.PI * 0.4) * 5) * 0.06;
                }

                // Raycasting para efecto de onda / repulsión al pasar el cursor
                raycaster.setFromCamera(mouse, camera);
                const ray = raycaster.ray;

                const prog = assemblyProgress.value;

                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;

                    // Posición objetivo escalada por el latido
                    const tx = targetPositions[idx] * pulseScale;
                    const ty = targetPositions[idx + 1] * pulseScale;
                    const tz = targetPositions[idx + 2] * pulseScale;

                    const sx = sourcePositions[idx];
                    const sy = sourcePositions[idx + 1];
                    const sz = sourcePositions[idx + 2];

                    // Interpolación de ensamblaje desde disperso a corazón
                    let cx = sx + (tx - sx) * prog;
                    let cy = sy + (ty - sy) * prog;
                    let cz = sz + (tz - sz) * prog;

                    // Deformación ondulatoria sutil
                    cx += Math.sin(elapsedTime * 2 + cy * 0.2) * 0.15;
                    cy += Math.cos(elapsedTime * 2 + cx * 0.2) * 0.15;

                    // Repulsión por hover
                    const pVec = new THREE.Vector3(cx, cy, cz);
                    const distToRay = ray.distanceToPoint(pVec);

                    if (distToRay < 5) {
                        const force = (5 - distToRay) * 0.8;
                        const dir = pVec.clone().sub(ray.origin).normalize();
                        cx += dir.x * force;
                        cy += dir.y * force;
                        cz += dir.z * force;
                    }

                    positions[idx] = cx;
                    positions[idx + 1] = cy;
                    positions[idx + 2] = cz;
                }

                heartGeometry.attributes.position.needsUpdate = true;

                // Rotación suave continua
                heartParticles.rotation.y = Math.sin(elapsedTime * 0.3) * 0.15;
            }

            // Rotación suave del polvo estelar de fondo
            bgParticles.rotation.y = elapsedTime * 0.02;

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 6. EVENTOS DE INTERFAZ DE USUARIO ---
        const messageDisplay = document.getElementById('messageDisplay');
        const customInput = document.getElementById('customInput');
        const btnApplyText = document.getElementById('btnApplyText');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const densitySlider = document.getElementById('densitySlider');
        const densityVal = document.getElementById('densityVal');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const btnReform = document.getElementById('btnReform');
        const toggleUI = document.getElementById('toggleUI');
        const controlsPanel = document.getElementById('controlsPanel');

        // Aplicar texto personalizado
        function updateText(msg) {
            messageDisplay.style.opacity = '0';
            messageDisplay.style.transform = 'scale(0.9)';
            setTimeout(() => {
                messageDisplay.textContent = msg;
                messageDisplay.style.opacity = '1';
                messageDisplay.style.transform = 'scale(1)';
            }, 300);
        }

        btnApplyText.addEventListener('click', () => {
            if (customInput.value.trim() !== '') {
                updateText(customInput.value.trim());
            }
        });

        document.querySelectorAll('.preset-msg').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.textContent.replace(' ♥', '');
                customInput.value = text;
                updateText(text);
            });
        });

        // Cambiar velocidad de latido
        speedSlider.addEventListener('input', (e) => {
            pulseSpeed = parseFloat(e.target.value);
            speedVal.textContent = `${pulseSpeed.toFixed(1)}x`;
        });

        // Cambiar densidad de partículas
        densitySlider.addEventListener('change', (e) => {
            const count = parseInt(e.target.value);
            densityVal.textContent = `${(count / 1000).toFixed(0)}k`;
            createHeartParticleSystem(count);
        });

        // Cambiar esquema de color
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => {
                    b.classList.remove('ring-2', 'ring-white/50', 'opacity-100');
                    b.classList.add('opacity-70');
                });
                btn.classList.add('ring-2', 'ring-white/50', 'opacity-100');
                btn.classList.remove('opacity-70');

                const themeKey = btn.getAttribute('data-color');
                currentTheme = COLOR_THEMES[themeKey];

                // Actualizar brillo del texto
                messageDisplay.style.dropShadow = `0 0 25px ${currentTheme.glow}`;

                // Recargar colores de partículas
                createHeartParticleSystem(particleCount);
            });
        });

        // Pausar / Reanudar
        btnPlayPause.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playText.textContent = "Pausar";
                playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
            } else {
                playText.textContent = "Reanudar";
                playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
            }
        });

        // Reorganizar / Reensamblar partículas
        btnReform.addEventListener('click', () => {
            triggerAssemblyAnimation();
        });

        // Ocultar / Mostrar UI
        let uiVisible = true;
        toggleUI.addEventListener('click', () => {
            uiVisible = !uiVisible;
            if (uiVisible) {
                controlsPanel.style.opacity = '1';
                controlsPanel.style.pointerEvents = 'auto';
                controlsPanel.style.transform = 'translateY(0)';
            } else {
                controlsPanel.style.opacity = '0';
                controlsPanel.style.pointerEvents = 'none';
                controlsPanel.style.transform = 'translateY(20px)';
            }
        });

        // Ajuste responsive de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            createHeartParticleSystem(particleCount);
            animate();
        };
    </script>

<script id="milo-premium-js">
/* MILO_PREMIUM_JS_START */
(function(){
  if (window.__miloPremium) return;
  window.__miloPremium = true;
  function reveal(){
    const els = Array.from(document.querySelectorAll('section, .card, .glass-card, .glass-panel, .polaroid-card'));
    els.forEach((el,i) => { el.classList.add('milo-reveal'); el.style.transitionDelay = (i % 6)*0.06 + 's'; });
    if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('is-visible')); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
    setTimeout(() => els.forEach(el => el.classList.add('is-visible')), 1800);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reveal); else reveal();
})();
