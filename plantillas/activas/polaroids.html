<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestras polaroids — Ana & Luis</title>
<meta name="description" content="Una pila de polaroids con sus momentos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9e2d5;
  --paper: #fdfbf5;
  --ink: #33302a;
  --ink-soft: #7a756a;
  --tape: rgba(222, 196, 138, .55);
  --rose: #e0527f;
  --wine: #743142;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(44rem 30rem at 14% 12%, rgba(224, 82, 127, .1), transparent 58%),
    radial-gradient(48rem 32rem at 88% 86%, rgba(189, 145, 82, .16), transparent 62%),
    var(--bg);
  overflow-x: hidden;
}
h1, h2, .serif { font-family: "Fraunces", Georgia, serif; }
.cave { font-family: "Caveat", cursive; }

/* =========== INTRO =========== */
.intro {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center; text-align: center;
  padding: 24px;
  background: inherit;
  transition: opacity .7s ease, visibility .7s ease;
}
.intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.intro-kicker { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; color: var(--wine); }
.intro h1 { font-size: clamp(2.6rem, 8vw, 4.4rem); letter-spacing: -.02em; margin: 12px 0 8px; }
.intro h1 em { font-style: italic; color: var(--rose); }
.intro p { color: var(--ink-soft); max-width: 42ch; margin: 0 auto 26px; font-weight: 300; }
.open-btn {
  border: none; cursor: pointer; font: inherit; font-weight: 600; color: #fff;
  padding: 15px 34px; border-radius: 999px;
  background: linear-gradient(115deg, #743142, #a6486a);
  box-shadow: 0 16px 34px rgba(116, 49, 66, .35);
  transition: transform .2s ease;
}
.open-btn:hover { transform: translateY(-2px); }

/* =========== ESCENA =========== */
.scene { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 52px 20px 140px; min-height: 100vh; }
.scene-head { text-align: center; margin-bottom: 20px; }
.scene-head .kicker { font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 700; color: #a5793f; }
.scene-head h2 { font-size: clamp(1.7rem, 4.6vw, 2.5rem); margin-top: 8px; letter-spacing: -.015em; }
.scene-head h2 em { font-style: italic; color: var(--rose); }
.hint { text-align: center; color: var(--ink-soft); font-size: .92rem; font-weight: 300; margin-bottom: 10px; }

.desk {
  position: relative;
  min-height: 78vh;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 6px;
}
.polaroid {
  width: min(230px, 26vw);
  background: var(--paper);
  border-radius: 4px;
  padding: 10px 10px 14px;
  box-shadow: 0 2px 4px rgba(51, 48, 42, .18), 0 18px 34px rgba(51, 48, 42, .16);
  cursor: pointer;
  border: none;
  font: inherit;
  text-align: inherit;
  transition: transform .35s cubic-bezier(.2,.8,.25,1), box-shadow .35s ease, z-index 0s;
  position: relative;
  outline: none;
}
.polaroid::before {
  content: "";
  position: absolute;
  top: -12px; left: 50%; transform: translateX(-50%) rotate(-3deg);
  width: 84px; height: 24px;
  background: var(--tape);
  box-shadow: 0 3px 6px rgba(51, 48, 42, .14);
}
.polaroid .imagine { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; }
.polaroid .cave {
  margin-top: 10px;
  font-size: 1.35rem;
  line-height: 1.1;
  text-align: center;
  color: #4d4438;
}
.polaroid:hover, .polaroid:focus-visible {
  z-index: 20;
  transform: rotate(0deg) scale(1.1) !important;
  box-shadow: 0 6px 12px rgba(51, 48, 42, .2), 0 34px 60px rgba(51, 48, 42, .3);
}
.polaroid.big-stack { animation: drop-in .9s cubic-bezier(.2,.8,.25,1) backwards; }
@keyframes drop-in {
  from { transform: translateY(-120vh) rotate(var(--tilt)); opacity: 0; }
  62% { transform: translateY(12px) rotate(var(--tilt)); opacity: 1; }
  78% { transform: translateY(-4px) rotate(var(--tilt)); }
  100% { transform: translateY(0) rotate(var(--tilt)); opacity: 1; }
}
.polaroid:nth-child(even) { transform: rotate(3.6deg); }
.polaroid:nth-child(odd) { transform: rotate(-2.8deg); }

/* =========== ZOOM =========== */
.zoom {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center; padding: 22px;
  background: rgba(40, 36, 30, .6); backdrop-filter: blur(5px);
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}
.zoom.open { opacity: 1; visibility: visible; }
.zoom-card {
  background: var(--paper);
  max-width: 420px; width: 100%;
  border-radius: 6px; padding: 14px 14px 20px;
  box-shadow: 0 40px 80px rgba(20, 16, 10, .55);
  text-align: center;
  transform: scale(.9);
  transition: transform .3s cubic-bezier(.2,.8,.25,1);
}
.zoom.open .zoom-card { transform: rotate(0deg); }
.zoom-photo { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; }
.zoom-note { font-family: "Caveat", cursive; font-size: 1.85rem; margin: 14px 0 4px; color: #4d4438; }
.zoom-msg { color: var(--ink-soft); font-weight: 300; line-height: 1.5; max-width: 34ch; margin: 0 auto; }
.zoom-close {
  margin-top: 14px; border: none; background: none; font: inherit;
  color: var(--wine); font-weight: 600; cursor: pointer; padding: 6px 16px; border-radius: 999px;
}
.zoom-close:hover { background: rgba(116, 49, 66, .09); }

.foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; text-align: center;
  padding: 14px 16px 18px; font-size: .84rem; color: rgba(51, 48, 42, .68);
  background: linear-gradient(180deg, transparent, rgba(233, 226, 213, .9));
  pointer-events: none;
}
.foot strong { color: var(--wine); font-weight: 600; }

@media (max-width: 700px) {
  .polaroid { width: 42vw; }
  .desk { min-height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
<!-- MILO_PREMIUM_CSS -->
<style id="milo-premium">
/* MILO_PREMIUM_START */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap');
:root {
  --milo-rose: #e0527f;
  --milo-wine: #743142;
  --milo-gold: #d4af37;
  --milo-cream: #f6eee3;
  --milo-ink: #2a1f1c;
  --milo-glass: rgba(255,255,255,0.08);
  --milo-border: rgba(255,255,255,0.18);
}
html { scroll-behavior: smooth; }
body { font-family: 'Outfit', system-ui, -apple-system, sans-serif; }
h1,h2,h3,.font-script { font-family: 'Playfair Display', serif; letter-spacing: -0.01em; }
button, .btn { font-family: 'Outfit', sans-serif; }
.glass-card, .glass-panel, .card { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.card, .glass-card, .glass-panel { border: 1px solid var(--milo-border); box-shadow: 0 18px 45px rgba(0,0,0,0.18); transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; }
.card:hover, .glass-card:hover, .glass-panel:hover { transform: translateY(-4px); box-shadow: 0 24px 60px rgba(224,82,127,0.22); border-color: rgba(224,82,127,0.35); }
button, .btn { transition: transform .2s ease, box-shadow .2s ease, filter .2s ease; }
button:hover, .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
img { transition: transform .5s ease, filter .5s ease; }
img:hover { transform: scale(1.04); filter: saturate(1.1); }
.milo-reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform .9s ease; }
.milo-reveal.is-visible { opacity: 1; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* MILO_PREMIUM_END */
</style>
<!-- /MILO_PREMIUM_CSS -->
</head>
<body>
  <div id="intro" class="intro">
    <div>
      <p class="intro-kicker">Revelados con cariño</p>
      <h1>Ana <em>&</em> Luis</h1>
      <p>Una pila de fotos reveladas a mano, cada una con su nota al dorso. Tócalas y deja que caigan.</p>
      <button id="open-desk" class="open-btn" type="button">Ver las polaroids</button>
    </div>
  </div>

  <main class="scene">
    <header class="scene-head">
      <p class="kicker">Polaroids</p>
      <h2>Momentos revelados <em>a mano</em>.</h2>
    </header>
    <p class="hint">Toca una polaroid para acercarla.</p>

    <div class="desk" id="desk"></div>
  </main>

  <div class="zoom" id="zoom" aria-hidden="true">
    <article class="zoom-card" role="dialog" aria-modal="true">
      <div class="zoom-photo" id="zoom-photo"></div>
      <p class="zoom-note" id="zoom-note">—</p>
      <p class="zoom-msg" id="zoom-msg">—</p>
      <button class="zoom-close" id="zoom-close" type="button">Volver al montón</button>
    </article>
  </div>

  <footer class="foot">
    Reveladas por <strong>Creaciones Milo</strong> &middot; Bolivia
  </footer>

<script>
/* =====================================================================
   CONFIGURACIÓN — para cada cliente:
     photo: URL de la foto real (o vacío = placeholder con iniciales)
     note:  el texto manuscrito (como al dorso de la polaroid)
     msg:   el texto largo que aparece al acercarla
   ===================================================================== */
/*[CFG]*/
const DESK = [
  { photo: '', initials: 'A', grad: 1, note: 'El primer café', msg: 'Del 14 de febrero de 2021: dos tazas y una conversación sin final.' },
  { photo: '', initials: 'A&L', grad: 2, note: 'Nuestro paseo', msg: 'La plaza, un helado de dos sabores y una decisión: seguir caminando.' },
  { photo: '', initials: 'L', grad: 3, note: 'El día de lluvia', msg: 'Un paraguas prestado que jamás regresamos. ¿Por qué hacerlo?' },
  { photo: '', initials: 'A', grad: 4, note: 'La receta de la abuela', msg: 'El gusanito y una torta que salió milagrosamente bien.' },
  { photo: '', initials: 'A&L', grad: 5, note: 'Ruta 9, km 40', msg: 'Otro viaje sin planear: los mejores son esos.' },
  { photo: '', initials: 'L', grad: 6, note: 'El cumple sorpresa', msg: 'Pensabas que era una reunión normal. Sorpresa.' },
  { photo: '', initials: 'A', grad: 7, note: 'Mañana con patas', msg: 'Nike entró a nuestra vida y se ganó el sofá.' },
  { photo: '', initials: 'A&L', grad: 8, note: 'Ayer, hoy y mañana', msg: 'Todavía nos faltan muchísimas fotografías por revelar.' }
];
const MUSIC = { src: '', title: '' };
/*[/CFG]*/

const GRADS = [
  ['#e0527f', '#a6486a'],
  ['#c78b5e', '#743142'],
  ['#2f9e83', '#58c2a5'],
  ['#6a7fdb', '#8d9ce8'],
  ['#bd9152', '#e0b884'],
  ['#743142', '#5b2534']
];

function photoURL(p) {
  if (p.photo) return p.photo;
  const [c1, c2] = GRADS[(p.grad || 1) % GRADS.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient>
    <radialGradient id="v" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="rgba(255,255,255,.25)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient></defs>
    <rect width="360" height="360" fill="url(#g)"/>
    <rect width="360" height="360" fill="url(#v)"/>
    <g fill="rgba(255,255,255,.2)"><circle cx="64" cy="66" r="6"/><circle cx="296" cy="70" r="4"/><circle cx="300" cy="296" r="6"/></g>
    <text x="180" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-style="italic" fill="rgba(255,255,255,.92)">${(p.initials || '♥').replace(/&/g, '&amp;')}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const desk = document.getElementById('desk');
DESK.forEach(function (p, i) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'polaroid';
  el.style.setProperty('--tilt', (i % 2 === 0 ? -2.8 : 3.6) + 'deg');
  el.style.animationDelay = (i * 0.14) + 's';
  el.setAttribute('aria-label', p.note || 'Foto');
  el.innerHTML = `<span class="imagine" style="display:block;background-image:url('${photoURL(p)}')" aria-hidden="true"></span>
    <span class="cave">${p.note || ''}</span>`;
  el.addEventListener('click', function () { openZoom(p); });
  desk.appendChild(el);
});

/* ---------- Zoom ---------- */
const zoom = document.getElementById('zoom');
const zoomPhoto = document.getElementById('zoom-photo');
const zoomNote = document.getElementById('zoom-note');
const zoomMsg = document.getElementById('zoom-msg');

function openZoom(p) {
  zoomPhoto.style.backgroundImage = "url('" + photoURL(p) + "')";
  zoomNote.textContent = p.note || '';
  zoomMsg.textContent = p.msg || '';
  zoom.classList.add('open');
  zoom.setAttribute('aria-hidden', 'false');
  document.getElementById('zoom-close').focus();
}
function closeZoom() {
  zoom.classList.remove('open');
  zoom.setAttribute('aria-hidden', 'true');
}
document.getElementById('zoom-close').addEventListener('click', closeZoom);
zoom.addEventListener('click', function (event) { if (event.target === zoom) closeZoom(); });
document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeZoom(); });

/* ---------- Intro ---------- */
document.getElementById('open-desk').addEventListener('click', function () {
  document.getElementById('intro').classList.add('hidden');
});
</script>

<script>/*[PLAYER]*/
(function(){
  var M = (typeof MUSIC === 'undefined') ? null : MUSIC || {};
  if (!M || !M.src) return;
  var st = document.createElement('style'); st.textContent = '.music-btn{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;z-index:95;background:linear-gradient(135deg,#743142,#e0527f);box-shadow:0 12px 26px rgba(116,49,66,.45);display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;transition:transform .2s,filter .2s}.music-btn:hover{transform:translateY(-2px)}@keyframes mbar{0%,100%{height:5px}50%{height:15px}}.music-btn i{display:block;width:3px;border-radius:2px;background:rgba(255,250,242,.95);height:5px;margin:0 1.5px}.music-btn.playing i{animation:mbar 1s ease-in-out infinite}.music-btn.playing i:nth-child(2){animation-delay:.15s}.music-btn.playing i:nth-child(3){animation-delay:.3s}.music-btn.playing i:nth-child(4){animation-delay:.45s}';
  document.head.appendChild(st);
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'music-btn'; b.title = M.title || 'Canción';
  b.setAttribute('aria-label', 'Poner o quitar la música');
  b.innerHTML = '<i></i><i></i><i></i><i></i>';
  var a = new Audio(M.src); a.loop = true; a.preload = 'none';
  b.addEventListener('click', function(){
    if (a.paused) { a.play().then(function(){ b.classList.add('playing'); }).catch(function(){ b.style.display = 'none'; }); }
    else { a.pause(); b.classList.remove('playing'); }
  });
  document.body.appendChild(b);
})();
/*[/PLAYER]*/</script>
<!-- MILO_PREMIUM_JS -->
<script id="milo-premium-js">
/* MILO_PREMIUM_JS_START */
(function(){
  if (window.__miloPremium) return;
  window.__miloPremium = true;
  function reveal(){
    const els = Array.from(document.querySelectorAll('section, .card, .glass-card, .glass-panel, .polaroid-card'));
    els.forEach((el,i) => { el.classList.add('milo-reveal'); el.style.transitionDelay = (i % 6)*0.06 + 's'; });
    if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('is-visible')); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
    setTimeout(() => els.forEach(el => el.classList.add('is-visible')), 1800);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reveal); else reveal();
})();
/* MILO_PREMIUM_JS_END */
</script>
<!-- /MILO_PREMIUM_JS -->
</body>
</html>
