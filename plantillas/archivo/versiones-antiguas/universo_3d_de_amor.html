<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparando Magia Para Ti ♥</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls para Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05010a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        .font-script {
            font-family: 'Great Vibes', cursive;
        }

        /* Ambient Glow Effect */
        .glow-pink {
            box-shadow: 0 0 35px rgba(244, 114, 182, 0.4);
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(18, 5, 25, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 114, 182, 0.2);
        }

        /* Progress ring stroke animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="relative text-rose-100 min-h-screen">

    <!-- CANVAS THREE.JS -->
    <div id="webgl-container" class="fixed inset-0 z-0"></div>

    <!-- 1. PANTALLA DE CARGA (PREPARANDO MAGIA...) -->
    <div id="loaderScreen" class="fixed inset-0 z-50 bg-[#07020d] flex flex-col items-center justify-center p-4 transition-opacity duration-700">
        <div class="relative flex items-center justify-center mb-6">
            <!-- Anillo animado de carga -->
            <svg class="w-36 h-36" viewBox="0 0 120 120">
                <circle class="text-rose-950/40" stroke-width="6" stroke="currentColor" fill="transparent" r="50" cx="60" cy="60" />
                <circle id="loadRing" class="progress-ring__circle text-rose-500" stroke-width="6" stroke-dasharray="314.15" stroke-dashoffset="314.15" stroke-linecap="round" fill="transparent" r="50" cx="60" cy="60" />
            </svg>
            <span id="loadPercent" class="absolute font-bold text-2xl text-rose-300">0%</span>
        </div>

        <h2 class="text-xl sm:text-2xl font-light text-rose-200 tracking-wider mb-2">Preparando magia...</h2>
        <p class="text-xs text-rose-400/60 uppercase tracking-widest animate-pulse">Cargando recuerdos inolvidables</p>
    </div>

    <!-- 2. PANTALLA DE BIENVENIDA (BOTÓN CLICK AQUÍ) -->
    <div id="startScreen" class="fixed inset-0 z-40 bg-[#07020d]/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center opacity-0 pointer-events-none transition-opacity duration-700">
        <div class="max-w-md w-full glass-panel p-8 sm:p-10 rounded-3xl glow-pink border border-rose-500/30">
            <span class="text-rose-400 text-3xl mb-3 block animate-bounce">♥</span>
            <h1 class="font-script text-4xl sm:text-5xl text-rose-200 mb-6 leading-tight">
                BUENOS DÍAS MI AMOR, SOLO PARA USTED ♥
            </h1>
            
            <button id="btnStart" class="w-full py-4 px-8 rounded-full bg-gradient-to-r from-rose-600 to-rose-400 text-white font-semibold text-sm tracking-widest uppercase shadow-xl hover:scale-105 active:scale-95 transition-all glow-pink">
                Click aquí ♥
            </button>
        </div>
    </div>

    <!-- 3. INTERFAZ OVERLAY (DESPUÉS DEL CLICK) -->
    <div id="uiOverlay" class="fixed inset-0 z-10 pointer-events-none opacity-0 transition-opacity duration-1000 flex flex-col justify-between p-6">
        <!-- Encabezado superior -->
        <div class="flex items-center justify-between">
            <div class="glass-panel px-4 py-2 rounded-full border border-rose-500/30">
                <p class="text-xs text-rose-300 font-semibold tracking-wider">Universo de Amor ♥</p>
            </div>
            <div class="glass-panel px-4 py-2 rounded-full border border-rose-500/30">
                <p class="text-[10px] text-rose-400/80 uppercase tracking-widest">Arrastra para explorar 3D</p>
            </div>
        </div>

        <!-- Mensaje modal emergente al hacer clic en cualquier tarjeta -->
        <div id="photoModal" class="self-center pointer-events-auto hidden max-w-sm w-full glass-panel p-6 rounded-2xl text-center transform transition-all border border-rose-400/40 glow-pink">
            <p id="modalText" class="font-script text-3xl text-rose-200 mb-2">¡Te amo mucho!</p>
            <p class="text-xs text-rose-300/80 font-light mb-4">Un recordatorio especial en este universo.</p>
            <button id="closeModal" class="px-5 py-1.5 rounded-full bg-rose-600/60 hover:bg-rose-600 text-white text-xs tracking-wider uppercase transition-colors">
                Cerrar
            </button>
        </div>

        <!-- Pie de página -->
        <div class="text-center">
            <p class="font-script text-2xl text-rose-300/90 drop-shadow">Eres mi sol, mi vida y mi todo ♥</p>
        </div>
    </div>

    <!-- JS DE THREE.JS Y ESCENA 3D -->
    <script>
        // --- 1. CONFIGURACIÓN INICIAL DE THREE.JS ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // Niebla suave de fondo
        scene.fog = new THREE.FogExp2(0x05010a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Controles de Cámara (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.minDistance = 15;
        controls.maxDistance = 80;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xf472b6, 2, 100);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // --- 2. GENERACIÓN DE TEXTURAS (ILUSTRACIONES Y TEXTOS) ---
        
        // Frases románticas
        const romanticPhrases = [
            "TE AMO", "ERES MI SOL", "MI VIDA", "PARA SIEMPRE", 
            "TE MUCHO MI BEBÉ", "ERES MI TODO", "JUNTOS SIEMPRE", 
            "MI AMOR", "MI LUGAR SEGURO", "GRACIAS POR EXISTIR"
        ];

        // Función para generar tarjetas de texto en Canvas
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Fondo suave semi-transparente
            ctx.fillStyle = 'rgba(255, 240, 245, 0.95)';
            ctx.roundRect(10, 10, 492, 236, 30);
            ctx.fill();

            // Borde rosa brillante
            ctx.strokeStyle = '#e11d48';
            ctx.lineWidth = 8;
            ctx.stroke();

            // Texto principal
            ctx.fillStyle = '#881337';
            ctx.font = 'bold 44px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 128);

            return new THREE.CanvasTexture(canvas);
        }

        // Función para generar ilustraciones tiernas simuladas en Canvas
        function createIllustrationTexture(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            // Fondo blanco tarjeta
            ctx.fillStyle = '#ffffff';
            ctx.roundRect(10, 10, 280, 280, 24);
            ctx.fill();
            ctx.strokeStyle = '#fda4af';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Dibujos caricaturescos de gatitos / ositos tiernos
            ctx.save();
            ctx.translate(150, 140);

            // Cabeza del personaje
            ctx.fillStyle = '#fce7f3';
            ctx.beginPath();
            ctx.arc(0, 0, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#9f1239';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Orejitas
            ctx.beginPath();
            ctx.moveTo(-45, -40); ctx.lineTo(-65, -85); ctx.lineTo(-20, -60);
            ctx.moveTo(45, -40); ctx.lineTo(65, -85); ctx.lineTo(20, -60);
            ctx.fillStyle = '#f472b6';
            ctx.fill();
            ctx.stroke();

            // Ojos felices
            ctx.fillStyle = '#881337';
            ctx.beginPath();
            ctx.arc(-22, -10, 7, 0, Math.PI * 2);
            ctx.arc(22, -10, 7, 0, Math.PI * 2);
            ctx.fill();

            // Mofletes rosados
            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.arc(-35, 10, 10, 0, Math.PI * 2);
            ctx.arc(35, 10, 10, 0, Math.PI * 2);
            ctx.fill();

            // Corazón sostenido
            ctx.fillStyle = '#e11d48';
            ctx.beginPath();
            ctx.moveTo(0, 35);
            ctx.bezierCurveTo(-25, 15, -35, 45, 0, 65);
            ctx.bezierCurveTo(35, 45, 25, 15, 0, 35);
            ctx.fill();

            ctx.restore();

            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. CREACIÓN DE OBJETOS EN EL ESPACIO 3D ---
        const interactiveGroup = new THREE.Group();
        scene.add(interactiveGroup);

        const cardObjects = [];
        const cardCount = 70; // Cantidad total de elementos flotantes

        for (let i = 0; i < cardCount; i++) {
            const isText = i % 3 === 0;
            let texture;
            let width, height;

            if (isText) {
                const phrase = romanticPhrases[Math.floor(Math.random() * romanticPhrases.length)];
                texture = createTextTexture(phrase);
                width = 5;
                height = 2.5;
            } else {
                texture = createIllustrationTexture(i);
                width = 3.8;
                height = 3.8;
            }

            const geometry = new THREE.PlaneGeometry(width, height);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true
            });

            const mesh = new THREE.Mesh(geometry, material);

            // Distribución Esférica aleatoria alrededor del centro
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 14 + Math.random() * 22; // Radio de dispersión

            mesh.position.x = r * Math.sin(phi) * Math.cos(theta);
            mesh.position.y = r * Math.sin(phi) * Math.sin(theta);
            mesh.position.z = r * Math.cos(phi);

            // Orientación mirando siempre hacia afuera del núcleo
            mesh.lookAt(0, 0, 0);
            mesh.rotation.z += (Math.random() - 0.5) * 0.4;

            // Datos personalizados para animación
            mesh.userData = {
                originalPosition: mesh.position.clone(),
                speedY: (Math.random() - 0.5) * 0.02,
                rotSpeed: (Math.random() - 0.5) * 0.01,
                phrase: isText ? "Mensaje especial" : "¡Un abrazo virtual para ti! ♥"
            };

            interactiveGroup.add(mesh);
            cardObjects.push(mesh);
        }

        // --- 4. SISTEMA DE PARTÍCULAS / CORAZONES BRILLANTES ---
        const particleCount = 600;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 100;
            positions[i + 1] = (Math.random() - 0.5) * 100;
            positions[i + 2] = (Math.random() - 0.5) * 100;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Textura suave de estrella/luz rosa
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 64; pCanvas.height = 64;
        const pCtx = pCanvas.getContext('2d');
        const grad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(244, 114, 182, 1)');
        grad.addColorStop(1, 'rgba(5, 1, 10, 0)');
        pCtx.fillStyle = grad;
        pCtx.fillRect(0, 0, 64, 64);
        const pTexture = new THREE.CanvasTexture(pCanvas);

        const particleMat = new THREE.PointsMaterial({
            size: 1.5,
            map: pTexture,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- 5. LÓGICA DE CARGA Y PANTALLAS ---
        const loaderScreen = document.getElementById('loaderScreen');
        const loadRing = document.getElementById('loadRing');
        const loadPercent = document.getElementById('loadPercent');
        const startScreen = document.getElementById('startScreen');
        const btnStart = document.getElementById('btnStart');
        const uiOverlay = document.getElementById('uiOverlay');

        let percent = 0;
        const ringLength = 314.15;

        const loadTimer = setInterval(() => {
            percent += 2;
            const offset = ringLength - (percent / 100) * ringLength;
            loadRing.style.strokeDashoffset = offset;
            loadPercent.textContent = `${percent}%`;

            if (percent >= 100) {
                clearInterval(loadTimer);
                setTimeout(() => {
                    loaderScreen.style.opacity = '0';
                    setTimeout(() => {
                        loaderScreen.style.display = 'none';
                        startScreen.classList.remove('opacity-0', 'pointer-events-none');
                    }, 700);
                }, 300);
            }
        }, 30);

        // Al hacer clic en "Click aquí"
        btnStart.addEventListener('click', () => {
            startScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                startScreen.style.display = 'none';
                uiOverlay.classList.remove('opacity-0');
            }, 700);
        });

        // --- 6. RAYCASTING PARA INTERACTUAR CON LAS TARJETAS ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const photoModal = document.getElementById('photoModal');
        const modalText = document.getElementById('modalText');
        const closeModal = document.getElementById('closeModal');

        window.addEventListener('click', (e) => {
            // Ignorar clicks si la pantalla inicial está visible
            if (startScreen.style.display !== 'none') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardObjects);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;
                modalText.textContent = clickedObj.userData.phrase;
                photoModal.classList.remove('hidden');
            }
        });

        closeModal.addEventListener('click', () => {
            photoModal.classList.add('hidden');
        });

        // --- 7. BUCLE DE ANIMACIÓN CONTINUA ---
        function animate() {
            requestAnimationFrame(animate);

            // Rotación suave de las tarjetas individuales
            cardObjects.forEach((card) => {
                card.rotation.z += card.userData.rotSpeed;
                card.position.y += Math.sin(Date.now() * 0.002 + card.position.x) * 0.005;
            });

            // Rotación suave del sistema de partículas
            particleSystem.rotation.y += 0.0005;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Reajuste de pantalla al cambiar tamaño
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
