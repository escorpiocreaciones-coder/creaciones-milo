<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Galaxia de Amor para Ti</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030008;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }
        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .glass-card {
            background: rgba(20, 10, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 8px 32px 0 rgba(236, 72, 153, 0.2);
        }
        /* Pulsing Glow Animation */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4), inset 0 0 15px rgba(236, 72, 153, 0.2); }
            50% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.8), inset 0 0 25px rgba(236, 72, 153, 0.5); }
        }
        .glow-effect {
            animation: pulseGlow 3s infinite ease-in-out;
        }
        /* ===== EXPLOSIÓN BIG BANG ===== */
        #flash {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            background: radial-gradient(circle at 50% 52%, #ffffff 0%, #ff9ad5 28%, rgba(120, 40, 160, 0.65) 55%, rgba(3, 0, 8, 0) 78%);
            opacity: 0;
        }
        #canvas-container.shake {
            animation: shakeIt .9s cubic-bezier(.36,.07,.19,.97);
        }
        @keyframes shakeIt {
            10%, 90% { transform: translate(-2px, 1px) scale(1.02); }
            20%, 80% { transform: translate(4px, -2px) scale(1.03); }
            30%, 50%, 70% { transform: translate(-7px, 2px) scale(1.05); }
            40%, 60% { transform: translate(7px, -3px) scale(1.05); }
        }
        #ui-header {
            transition: opacity 1.1s ease .2s;
            opacity: 0;
        }
        #ui-bottom {
            transition: opacity 1s ease .6s;
            opacity: 0;
        }
        .ui-visible {
            opacity: 1 !important;
        }
    </style>
</head>
<body class="relative text-white overflow-hidden">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>
    <div id="flash"></div>

    <!-- UI Overlay: Header Banner -->
    <div id="ui-header" class="absolute top-6 left-1/2 -translate-x-1/2 z-10 text-center pointer-events-none w-11/12 max-w-lg">
        <h1 class="font-cursive text-4xl sm:text-6xl font-bold bg-gradient-to-r from-pink-300 via-rose-400 to-purple-400 bg-clip-text text-transparent drop-shadow-[0_0_15px_rgba(236,72,153,0.6)]">
            Una Galaxia de Amor para Ti
        </h1>
        <p class="text-xs sm:text-sm tracking-widest text-pink-200/80 uppercase mt-1">
            FELIZ CUMPLEANOS, MI VIDA ✨
        </p>
    </div>

    <!-- UI Overlay: Instructions & Action Button -->
    <div id="ui-bottom" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 text-center flex flex-col items-center gap-3">
        <button id="btn-enter" class="pointer-events-auto px-6 py-3 rounded-full glass-card text-pink-200 font-semibold tracking-wide hover:bg-pink-600/30 transition-all duration-300 flex items-center gap-2 glow-effect border border-pink-400/40 transform hover:scale-105 active:scale-95">
            <i data-lucide="sparkles" class="w-5 h-5 text-pink-400"></i>
            <span>ENTRAR A NUESTRO UNIVERSO</span>
        </button>
        <p class="text-xs text-pink-300/60 pointer-events-none">
            Arrastra para rotar • Haz clic en los corazones u objetos de la galaxia
        </p>
    </div>

    <!-- Interactive Love Cards Modal System -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-card" class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 text-center relative transform scale-95 transition-all duration-300 border border-pink-500/40 shadow-2xl">
            <!-- Close Button -->
            <button id="btn-close-modal" class="absolute top-4 right-4 p-2 text-pink-300/70 hover:text-white rounded-full hover:bg-pink-500/20 transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <!-- Modal Content Dynamic -->
            <div id="modal-icon-wrapper" class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center bg-gradient-to-tr from-pink-500/20 to-purple-500/20 border border-pink-400/30 text-pink-400 glow-effect">
                <i id="modal-icon" data-lucide="heart" class="w-10 h-10"></i>
            </div>
            
            <h2 id="modal-title" class="font-cursive text-3xl font-bold text-pink-200 mb-2">
                Amor de Mi Vida
            </h2>
            <p id="modal-body" class="text-sm text-pink-100/80 leading-relaxed font-light mb-6">
                Cuanto más tiempo estamos juntos, más te amo. Eres el regalo más bonito de mi vida.
            </p>

            <button id="btn-volver" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-medium text-sm tracking-wide shadow-lg shadow-pink-500/30 transition-all transform hover:scale-105 active:scale-95">
                VOLVER ❤️
            </button>
        </div>
    </div>

    <script>
        // --- DATA DE MENSAJES Y TARJETAS ---
        const loveMessages = [
            {
                title: "Amor de mi vida",
                text: "Cuanto más tiempo estamos juntos, más te amo. Gracias por iluminar cada uno de mis días con tu sonrisa única.",
                icon: "heart"
            },
            {
                title: "Para ti",
                text: "Para ti, que haces latir mi corazón de una forma única. En cada recuerdo y en cada latido, estás tú.",
                icon: "sparkles"
            },
            {
                title: "Para Siempre",
                text: "No me importa cuántas vidas tenga que vivir, en cada una de ellas te elegiría a ti. Para siempre y un día más.",
                icon: "infinity"
            },
            {
                title: "Feliz Cumpleaños",
                text: "Hoy celebramos tu existencia. Eres magia pura, eres mi persona favorita y el amor eterno de mi vida.",
                icon: "gift"
            },
            {
                title: "Eres Mi Universo",
                text: "Entre millones de estrellas en el cosmos, tus ojos son mis favoritos. Te adoro con toda mi alma.",
                icon: "star"
            }
        ];

        // --- TRES.JS CONFIGURACIÓN ---
        let scene, camera, renderer, controls;
        let galaxyGeometry, galaxyMaterial, galaxyPoints;
        let heartGroup, coreBlackHole;
        let orbitingLabels = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        /* --- BIG BANG: chispas, ondas y despliegue --- */
        let booms = [];            // sistemas de chispas activos {points, vels, t0, life, size}
        let shockRings = [];       // anillos de choque {mesh, t0, grow, life}
        let boomT0 = -1;           // inicio de la detonación (-1 = no explotó)
        const GX_SCALE0 = 0.03;    // la galaxia nace comprimida
        const SUNFOLD = 2.8;       // segundos en desplegar la galaxia
        const flashEl = document.getElementById('flash');
        const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

        function spawnSparks(count, speed, life, size) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);
            const vels = new Float32Array(count * 3);
            const cHot = new THREE.Color('#ffd9ec');
            const cMid = new THREE.Color('#ff2e93');
            const cFar = new THREE.Color('#b478ff');
            for (let i = 0; i < count; i++) {
                // dirección aleatoria uniforme sobre la esfera
                const u = Math.random() * 2 - 1;
                const phi = Math.random() * Math.PI * 2;
                const s = Math.sqrt(1 - u * u);
                const dir = new THREE.Vector3(s * Math.cos(phi), u * 0.62, s * Math.sin(phi));
                // velocidad con mezcla de colores según energía
                const v = speed * (0.35 + Math.random() * Math.random() * 0.65);
                vels[i * 3] = dir.x * v; vels[i * 3 + 1] = dir.y * v; vels[i * 3 + 2] = dir.z * v;
                pos[i * 3] = dir.x * 0.35; pos[i * 3 + 1] = dir.y * 0.35; pos[i * 3 + 2] = dir.z * 0.35;
                const c = new THREE.Color().copy(cHot).lerp(cMid, Math.random());
                if (Math.random() < 0.35) c.lerp(cFar, Math.random() * 0.8);
                col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const mat = new THREE.PointsMaterial({
                size, blending: THREE.AdditiveBlending,
                transparent: true, opacity: 1, depthWrite: false, vertexColors: true
            });
            const pts = new THREE.Points(geo, mat);
            scene.add(pts);
            booms.push({ points: pts, vels, t0: performance.now(), life, size });
        }

        function spawnRing(tilt, maxGrow, life, color) {
            const geo = new THREE.RingGeometry(0.96, 1.0, 96);
            const mat = new THREE.MeshBasicMaterial({
                color, side: THREE.DoubleSide, transparent: true, opacity: 0.85,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2 + tilt;
            scene.add(mesh);
            shockRings.push({ mesh, t0: performance.now(), grow: maxGrow, life });
        }

        function fireBoom() {
            if (boomT0 >= 0) return;
            boomT0 = performance.now();
            scene.add(new THREE.AmbientLight(0xff77c8, 1.4));   // resplandor inicial
            spawnSparks(2400, 26, 3.4, 0.22);
            spawnSparks(700, 12, 4.2, 0.30);
            spawnRing(0, 30, 2.0, '#ff7ab8');
            spawnRing(0.5, 22, 2.6, '#c084fc');
            spawnRing(-0.35, 38, 2.9, '#ff2e93');
            flashEl.style.transition = 'none'; flashEl.style.opacity = '1';
            requestAnimationFrame(() => { flashEl.style.transition = 'opacity .7s ease-out'; flashEl.style.opacity = '0'; });
            const cont = document.getElementById('canvas-container');
            cont.classList.add('shake');
            setTimeout(() => cont.classList.remove('shake'), 1000);
            document.getElementById('ui-header').classList.add('ui-visible');
            document.getElementById('ui-bottom').classList.add('ui-visible');
        }

        const canvasContainer = document.getElementById('canvas-container');

        function initThreeJS() {
            // Escena
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030008, 0.015);

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 32);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            canvasContainer.appendChild(renderer.domElement);

            // Controles de Cámara (OrbitControls)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 60;
            controls.minDistance = 8;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff499e, 3, 50);
            pointLight.position.set(0, 2, 0);
            scene.add(pointLight);

            // Crear Componentes 3D
            createBlackHoleCore();
            createSpiralGalaxy();
            create3DParticleHeart();
            createFloating3DTitles();
            createBackgroundStars();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);

            // Escena comprimida hasta que estalle el Big Bang
            setCollapsed(0);

            // Animación
            animate();
        }

        // Estado "antes del Big Bang": todo comprimido e invisible
        function setCollapsed(t01) {
            galaxyPoints.scale.setScalar(GX_SCALE0 + (1 - GX_SCALE0) * t01);
            coreBlackHole.scale.setScalar(0.15 + 0.85 * t01);
            heartGroup.position.y = 4.5 * t01;
            heartGroup.scale.setScalar(t01);
            heartMat.opacity = 0.9 * t01;
            orbitingLabels.forEach(s => s.material.opacity = t01);
        }

        // 1. Núcleo estilo "Black Hole Glow" rosa/morado
        function createBlackHoleCore() {
            const coreGroup = new THREE.Group();

            // Esfera Central Oscura
            const coreGeo = new THREE.SphereGeometry(1.8, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x05000a });
            const blackSphere = new THREE.Mesh(coreGeo, coreMat);
            coreGroup.add(blackSphere);

            // Anillo brillante alrededor (Disco de Acreción)
            const ringGeo = new THREE.RingGeometry(2.0, 3.8, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xff2a8d,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            coreGroup.add(ring);

            // Esfera de resplandor exterior (Glow)
            const glowGeo = new THREE.SphereGeometry(2.6, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xff007f,
                transparent: true,
                opacity: 0.25,
                wireframe: true
            });
            const glowSphere = new THREE.Mesh(glowGeo, glowMat);
            coreGroup.add(glowSphere);

            coreBlackHole = coreGroup;
            scene.add(coreGroup);
        }

        // 2. Galaxia en Espiral 3D de Partículas Rosa/Púrpura
        function createSpiralGalaxy() {
            const parameters = {
                count: 45000,
                size: 0.08,
                radius: 18,
                branches: 4,
                spin: 1.2,
                randomness: 0.6,
                power: 3,
                insideColor: '#ff4da6',
                outsideColor: '#6b21a8'
            };

            galaxyGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);

            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

            for (let i = 0; i < parameters.count; i++) {
                // Posición
                const i3 = i * 3;
                const radius = Math.random() * parameters.radius;
                const spinAngle = radius * parameters.spin;
                const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

                const randomX = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomY = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomZ = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                // Color interpolado de centro a bordes
                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / parameters.radius);

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Material con mapa circular sintético
            galaxyMaterial = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true
            });

            galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
            scene.add(galaxyPoints);
        }

        // 3. Estratégico Corazón Gigante 3D Flotando Sobre la Galaxia
        let heartMat; // para desvanecer el corazón durante el despliegue

        function create3DParticleHeart() {
            heartGroup = new THREE.Group();
            const heartCount = 1800;
            const heartGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(heartCount * 3);

            for (let i = 0; i < heartCount; i++) {
                const t = Math.PI * (2 * Math.random() - 1);
                const u = Math.PI * (Math.random() - 0.5);

                // Ecuación paramétrica de corazón 3D
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const z = u * 4;

                const scale = 0.22;
                positions[i * 3] = (x + (Math.random() - 0.5) * 0.8) * scale;
                positions[i * 3 + 1] = (y + (Math.random() - 0.5) * 0.8) * scale;
                positions[i * 3 + 2] = (z + (Math.random() - 0.5) * 0.8) * scale;
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            heartMat = new THREE.PointsMaterial({
                color: 0xff2e93,
                size: 0.16,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0 // se revela con el despliegue
            });

            const heartParticles = new THREE.Points(heartGeo, heartMat);
            heartGroup.add(heartParticles);
            heartGroup.position.set(0, 4.5, 0); // Flotando arriba del agujero negro
            scene.add(heartGroup);
        }

        // 4. Objetos y Textos 3D Orbitando Interactivamente
        function createFloating3DTitles() {
            const labelGroup = new THREE.Group();
            const count = loveMessages.length;
            const radius = 12;

            loveMessages.forEach((msg, idx) => {
                const angle = (idx / count) * Math.PI * 2;
                
                // Crear Canvas para convertir texto en Textura Three.js
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');

                // Fondo con bordes redondeados suave
                ctx.fillStyle = 'rgba(255, 46, 147, 0.25)';
                ctx.strokeStyle = 'rgba(255, 182, 217, 0.8)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(10, 10, 492, 108, 40);
                ctx.fill();
                ctx.stroke();

                // Texto
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`❤️ ${msg.title}`, 256, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ 
                    map: texture, 
                    transparent: true,
                    opacity: 0 // aparecen al disparar la explosión
                });
                const sprite = new THREE.Sprite(spriteMaterial);
                
                const posX = Math.cos(angle) * radius;
                const posZ = Math.sin(angle) * radius;
                const posY = (Math.random() - 0.5) * 3;

                sprite.position.set(posX, posY, posZ);
                sprite.scale.set(5.5, 1.4, 1);
                
                // Guardar metadatos para interacción
                sprite.userData = { message: msg, angle: angle, radius: radius, speed: 0.003 + Math.random() * 0.002 };

                orbitingLabels.push(sprite);
                labelGroup.add(sprite);
            });

            scene.add(labelGroup);
        }

        // 5. Fondo Estelar Distante
        function createBackgroundStars() {
            const starsGeo = new THREE.BufferGeometry();
            const count = 3000;
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 180;
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.06,
                transparent: true,
                opacity: 0.6
            });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);
        }

        // --- INTERACCIÓN DE CLICS (Raycaster) ---
        function onDocumentClick(event) {
            // Ignorar clics en la interfaz UI
            if (event.target.closest('#modal-card') || event.target.closest('#btn-enter')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersectar sprites orbitando
            const intersects = raycaster.intersectObjects(orbitingLabels);

            if (intersects.length > 0) {
                const clickedSprite = intersects[0].object;
                openModal(clickedSprite.userData.message);
            }
        }

        // --- SISTEMA DE MODAL ---
        const modalContainer = document.getElementById('modal-container');
        const modalCard = document.getElementById('modal-card');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalIcon = document.getElementById('modal-icon');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnVolver = document.getElementById('btn-volver');
        const btnEnter = document.getElementById('btn-enter');

        function openModal(data) {
            modalTitle.textContent = data.title;
            modalBody.textContent = data.text;
            
            // Actualizar icono de Lucide
            modalIcon.setAttribute('data-lucide', data.icon);
            lucide.createIcons();

            modalContainer.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            modalContainer.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }

        btnCloseModal.addEventListener('click', closeModal);
        btnVolver.addEventListener('click', closeModal);
        
        btnEnter.addEventListener('click', () => {
            // Pequeña detonación de chispas al entrar
            if (boomT0 >= 0) spawnSparks(420, 9, 2.2, 0.16);
            // Abrir tarjeta aleatoria al pulsar el botón principal
            const randomMsg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
            openModal(randomMsg);
        });

        // Resize handler
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- LOOP DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();

            // Despliegue de la galaxia + corazón desde el Big Bang
            if (boomT0 >= 0) {
                const tt = (now - boomT0) / 1000;
                const unfold = GX_SCALE0 + (1 - GX_SCALE0) * easeOut(tt / SUNFOLD);
                galaxyPoints.scale.setScalar(unfold);
                heartGroup.userData.unfold = easeOut(tt / (SUNFOLD * 0.7));
                if (heartMat) heartMat.opacity = 0.9 * THREE.MathUtils.clamp((tt - 1.0) / 1.2, 0, 1);
                const op = THREE.MathUtils.clamp((tt - 1.3) / 1.2, 0, 1);
                orbitingLabels.forEach(s => s.material.opacity = op);
                heartGroup.position.y = 4.5 * easeOut(tt / (SUNFOLD * 0.7));
                coreBlackHole.scale.setScalar(0.15 + 0.85 * easeOut(tt / (SUNFOLD * 0.55)));
            }

            // Chispas de explosión: viaje, frenado y desvanecimiento
            for (const b of booms) {
                const age = (now - b.t0) / 1000;
                const pos = b.points.geometry.attributes.position.array;
                const drag = Math.pow(0.985, age * 60);
                for (let i = 0; i < pos.length; i++) pos[i] += b.vels[i] * drag * (1 / 60);
                b.points.geometry.attributes.position.needsUpdate = true;
                b.points.material.opacity = Math.max(0, 1 - age / b.life);
                b.points.material.size = b.size * (1 + age * 0.35);
            }
            booms = booms.filter(b => { const done = (now - b.t0) / 1000 > b.life; if (done) { scene.remove(b.points); b.points.geometry.dispose(); b.points.material.dispose(); } return !done; });

            // Anillos de choque: expansión y desvanecimiento
            for (const r of shockRings) {
                const age = (now - r.t0) / 1000;
                const s = 1 + easeOut(age / (r.life * 0.8)) * r.grow;
                r.mesh.scale.set(s, s, 1);
                r.mesh.rotation.z += 0.01;
                r.mesh.material.opacity = Math.max(0, 0.85 * (1 - age / r.life));
            }
            shockRings = shockRings.filter(r => { const done = (now - r.t0) / 1000 > r.life; if (done) { scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); } return !done; });

            // Rotación suave galaxia
            if (galaxyPoints) {
                galaxyPoints.rotation.y += 0.0015;
            }

            // Pulsación y rotación del corazón 3D
            if (heartGroup) {
                heartGroup.rotation.y += 0.008;
                const time = Date.now() * 0.0025;
                const pulse = 1 + Math.sin(time) * 0.08;
                const uf = boomT0 >= 0 ? (heartGroup.userData.unfold || 0) : 1;
                heartGroup.scale.set(pulse * uf, pulse * uf, pulse * uf);
            }

            // Rotación Agujero Negro Core
            if (coreBlackHole) {
                coreBlackHole.rotation.y -= 0.005;
            }

            // Orbitado de etiquetas interactiva
            orbitingLabels.forEach(sprite => {
                sprite.userData.angle += sprite.userData.speed;
                sprite.position.x = Math.cos(sprite.userData.angle) * sprite.userData.radius;
                sprite.position.z = Math.sin(sprite.userData.angle) * sprite.userData.radius;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Inicializar cuando se cargue todo el contenido DOM
        window.onload = () => {
            initThreeJS();
            lucide.createIcons();
            // La explosión arranca sola en el inicio
            setTimeout(fireBoom, 800);
        };
    </script>
</body>
